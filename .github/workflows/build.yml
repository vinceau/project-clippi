name: build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
    tags-ignore:
      - "v*"

jobs:
  build:
    name: Test on node ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            release/app/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'release/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '' }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'release/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: |
          npm install
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run test
          npm run typecheck
#     - name: Lint
#       if: matrix.os == 'ubuntu-latest'
#       run: npm run lint
      - name: Build App
        run: npm run package
        env:
          CI: true
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      - name: Prepare artifacts
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          mv release/build/{*.exe,*.deb,*.AppImage,*.dmg} artifacts || true
      - name: Prepare Windows artifacts
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p artifacts
          mv release/build/*.exe artifacts || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
